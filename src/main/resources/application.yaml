server:
  port: ${PORT:8085}

spring:
  application:
    name: feed-service
  profiles:
    default: local
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_URL:}/auth/v1
          jwk-set-uri: ${SUPABASE_URL:}/auth/v1/.well-known/jwks.json
          audiences: authenticated
          jws-algorithms: ES256,RS256
          principal-claim-name: sub

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        liveness:
          include: livenessState

swapr:
  internal-token: ${INTERNAL_TOKEN:}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
